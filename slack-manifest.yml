display_information:
  name: Plane Bridge
  description: Create Plane issues from Slack via /plane.
  background_color: "#0d1117"
features:
  bot_user:
    display_name: Plane Bridge
    always_online: true
  slash_commands:
    - command: /plane
      url: https://slack-plane.example.com/slack/events
      description: Open a modal to create a Plane issue
      usage_hint: "[setup | reset | help]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - users:read
      - users:read.email
settings:
  event_subscriptions:
    request_url: https://slack-plane.example.com/slack/events
  interactivity:
    is_enabled: true
    request_url: https://slack-plane.example.com/slack/events
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
